    for (var i=0;i<state.driedFish.length;i++) {
      if (state.driedFish[i].name===sel && taken<tr2.capacity) {
        var mp=marketPrices[sel]||{cur:BASE_PRICES[sel]||1};
        earn+=mp.cur*3; toSend.push(state.driedFish[i]); taken++;
      } else rest.push(state.driedFish[i]);
    }
    if (!toSend.length) { showNotif(t('Нет сушёной рыбы!','No dried fish!')); return; }
    state.driedFish=rest;
    sentCount=toSend.length;
  } else {
    var taken2=0;
    for (var j=0;j<state.liveFish.length;j++) {
      if (state.liveFish[j].name===sel && taken2<tr2.capacity) {
        var mp2=marketPrices[sel]||{cur:BASE_PRICES[sel]||1};
        earn+=mp2.cur; toSend.push(state.liveFish[j]); taken2++;
      } else rest.push(state.liveFish[j]);
    }
    if (!toSend.length) { showNotif(t('Нет рыбы этого вида!','No fish of this kind!')); return; }
    state.liveFish=rest;
    sentCount=toSend.length;
  }
  earn=Math.round(earn*0.7*100)/100; // водитель забирает 30%
  var secs=delivTime(tr2);
  if (tr2.id !== 'rentalTruck') state.durability[tr2.id]=Math.max(0,dur2-10);
  state.delivery2={transportId:tr2.id,count:sentCount,earnings:earn,startedAt:Date.now(),endsAt:Date.now()+secs*1000};
  addQuestProgress('deliver', 1);
  state.selectedFish=null; state.selectedDried=false; state.selectedFilet=false;
  showNotif(t('Водитель отправлен на ','Driver sent on ')+tr2.emoji+' '+trName(tr2.id)+'!');
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function repairTr(id) {
  var tr=getTr(id); if (!tr) return;
  if (state.coins<tr.repairCost) { showNotif(t('Не хватает монет!','Not enough coins!')); return; }
  state.coins=Math.round((state.coins-tr.repairCost)*100)/100;
  state.durability[id]=100;
  queueAction({type:'repair_transport', transport: id});
  flushActions();
  showNotif('🔧 '+tr.emoji+' '+trName(tr.id)+' '+t('отремонтирован!','repaired!'));
  addQuestProgress('repair', 1);
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function useTruckTicket() {
  if ((state.truckTickets||0) <= 0) return;
  state.truckTickets--;
  var now = Date.now();
  var base = (state.boosts.truckRental > now) ? state.boosts.truckRental : now;
  state.boosts.truckRental = base + 43200000; // +12 часов (продлевает, если уже активна)
  showNotif(t('🎫 Билет использован! 🚛 +12 часов аренды грузовика','🎫 Ticket used! 🚛 +12 hours truck rental'));
  updateUI(); save(); renderMarket();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function selectTransport(id) {
  if (id==='rentalTruck') {
    if (state.boosts.truckRental <= Date.now()) return; // аренда истекла
  } else if (state.unlockedTransports.indexOf(id)<0) return;
  state.transport=id; save(); renderMarket();
}
function buyTransport(id) {
  var tr=getTr(id);
  if (!tr||state.coins<tr.cost||state.unlockedTransports.indexOf(id)>=0) return;
  state.coins=Math.round((state.coins-tr.cost)*100)/100;
  state.unlockedTransports.push(id); state.transport=id;
  queueAction({type:'buy_transport', transport: id});
  flushActions();
  showNotif(t('🎉 Куплен ','🎉 Bought ')+tr.emoji+' '+trName(tr.id)+'!');
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function switchLoc(id) {
  var loc=getLoc(id); if (!loc||!loc.unlocked) return;
  saveSaltKnifeToLoc(); // сохраняем склад соли/ножей старой локации перед уходом
  state.currentLoc=id;
  loadSaltKnifeFromLoc(); // подгружаем склад новой локации
  var ocean=document.getElementById('ocean');
  ocean.style.background=loc.bg; ocean.style.borderBottomColor=loc.border;
  document.getElementById('loc-label').textContent=loc.emoji+' '+locName(loc.id);
  spawnBubbles(); calcStats(); renderLocBar(); updateUI(); save();
}
function unlockLoc(id) {
  var loc=getLoc(id); if (!loc||loc.unlocked||state.coins<loc.cost) return;
  state.coins=Math.round((state.coins-loc.cost)*100)/100;
  loc.unlocked=true; state.unlockedLocs.push(id);
  if (!state.unlockedFish[id]) state.unlockedFish[id]=[FISH[id]&&FISH[id][0]?FISH[id][0].name:''];
  queueAction({type:'unlock_location', loc: id});
  flushActions();
  renderLocBar(); updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
// Календарный день по МСК (UTC+3) для метки времени в мс — граница суток строго в 00:00 МСК,
// а не "24 часа с момента получения". Так время следующего бонуса не "плывёт" в зависимости
// от того, в какое именно время суток игрок забрал предыдущий бонус.
function mskDay(ts) { return Math.floor((ts + 3*3600000) / 86400000); }

function getDailyStatus() {
  var now=Date.now(), last=state.dailyLastClaim, day=state.dailyDay;
  if (!last) return {canClaim:true,day:0,missed:false};
  var dayNow=mskDay(now), dayLast=mskDay(last);
  var gap=dayNow-dayLast; // сколько календарных суток МСК прошло с последнего получения
  var missGraceDays=isPremiumActive()?3:1; // 72ч/3 суток для Premium, 24ч/1 сутки для обычных
  if (gap>missGraceDays) return {canClaim:true,day:0,missed:true};
  if (gap>=1) return {canClaim:true,day:day,missed:false};
  var nextMidnightMsk=(dayLast+1)*86400000-3*3600000; // ts в UTC-мс для следующих 00:00 МСК
  return {canClaim:false,day:day,missed:false,nextIn:Math.ceil((nextMidnightMsk-now)/3600000)};
}
function claimDaily() {
  var st=getDailyStatus(); if (!st.canClaim) return;
  if (st.missed) state.dailyDay=0;
  var lm=maxUnlockedMult();
  var reward=Math.round(DAILY[state.dailyDay]*lm*100)/100;
  state.coins=Math.round((state.coins+reward)*100)/100;
  state.totalEarned=Math.round((state.totalEarned+reward)*100)/100;
  state.dailyLastClaim=Date.now();
  state.dailyDay=state.dailyDay>=6?0:state.dailyDay+1;
  queueAction({type:'daily_bonus', loc: state.currentLoc});
  flushActions();
  showNotif(t('🎁 День ','🎁 Day ')+state.dailyDay+t(' — получено 🪙',' — received 🪙')+fmt(reward)+'!');
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function resetGame() {
  if (!confirm('Сбросить весь прогресс?')) return;
  if (!confirm('Вы уверены? Нельзя отменить!')) return;
  // coins/caught/totalEarned/upgLevels/energy пишет только сервер — обнуляем их там
  // ПЕРЕД локальным сбросом, иначе они "подтянутся" обратно из Firebase при следующем сохранении.
  window._pendingActions = []; // на всякий случай не даём улетевшим ранее действиям всплыть после сброса
  var doLocalReset = function() {
    localStorage.removeItem(SAVE_KEY);
    localStorage.removeItem('ff5');
    localStorage.removeItem('ff4');
    localStorage.removeItem('ff3');
    localStorage.removeItem('ff_notiflog');
    notifLog = [];
    var keepName = state.playerName || '';
    state={coins:0,caught:0,tapPower:0.1,autoPerMin:0,
      currentLoc:'pond',unlockedLocs:['pond'],
      unlockedFish:{pond:['Карась']},caughtFish:{},liveFish:[],
      transport:'bike',delivery:null,delivery2:null,unlockedTransports:['bike'],
      durability:{bike:100,moped:100,car:100,truck:100},
      dailyDay:0,dailyLastClaim:0,lastSeen:0,totalEarned:0,selectedFish:null,selectedDried:false,selectedFilet:false,
      selectedItems:[],
      driverTransport:null,selectedDriverFish:null,selectedDriverDried:false,selectedDriverFilet:false,selectedDriverItems:[],driverSaltOrder:0,driverKnifeOrder:0,
      drying:[],driedFish:[],
      boosts:{doubleTap:0, turboDry:false, luckyRod:0, turboSpeed:0, turboPack:false, truckRental:0},
      truckTickets:0,
      premiumUntil:0, premiumFreeSpinDate:0, premiumFreeRepairDate:0,
      energy:100, lastEnergyUpdate:Date.now(), lastAdEnergyRefill:0, lastAdLotterySpin:0, fishSinceEnergySpend:0,
      quests:[], questsDate:0, questProgress:{},
      salt:0, saltOrder:0, salting:[],
      knife:0, knifeOrder:0, cutting:[], filets:[],
      saltByLoc:{}, knifeByLoc:{},
      upgLevels:{},
      playerName:keepName};
    for (var j=0;j<LOCATIONS.length;j++) LOCATIONS[j].unlocked=j===0;
    marketPrices={}; initPrices(); lastPriceUpdate=Date.now();
    tapped=false; scareFactor=1.0;
    document.getElementById('hint').style.opacity='1';
    calcStats(); switchLoc('pond'); showTab('upgrades');
    lastScoreUpload = 0; uploadScore(); // сразу обновляем таблицу лидеров, не ждём троттлинг в 60с
  };
  if (tg && tg.initData && typeof BOT_API_URL !== 'undefined') {
    fetch(BOT_API_URL + '/reset_progress', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ init_data: tg.initData })
    }).then(function(){ doLocalReset(); })
      .catch(function(){ showNotif(t('❌ Не удалось сбросить — проверь связь и попробуй ещё раз','❌ Reset failed — check connection and try again')); });
  } else {
    doLocalReset();
  }
}

// ── Тик ──────────────────────────────────────────────
function pushLiveFish(entry) {
  state.liveFish.push(entry);
}

function checkDeaths() {
  var now=Date.now(), dead=[], live=[];
  for (var i=0;i<state.liveFish.length;i++) {
    if (state.liveFish[i].dieAt<=now) dead.push(state.liveFish[i]);
    else live.push(state.liveFish[i]);
  }
  if (dead.length) {
    state.liveFish=live;
    if (dead.length===1) {
      showNotif('💀 '+dead[0].emoji+' '+fishName(dead[0].name)+' '+t('погибла!','died!'),true);
    } else {
      showNotif(t('💀 Погибло ','💀 ')+dead.length+t(' рыб!',' fish died!'),true);
    }
    save();
  }
}
function checkDelivery() {
  if (state.delivery && Date.now()>=state.delivery.endsAt) {
    state.coins=Math.round((state.coins+state.delivery.earnings)*100)/100;
    state.totalEarned=Math.round((state.totalEarned+state.delivery.earnings)*100)/100;
    addQuestProgress('earn', state.delivery.earnings);
    queueAction({type:'collect_delivery'});
    flushActions();
    var saltArrived=state.delivery.saltOrder||0;
    var knifeArrived=state.delivery.knifeOrder||0;
    var msg='💰 Доставка прибыла! +🪙'+fmt(state.delivery.earnings);
    if (saltArrived>0) { state.salt=(state.salt||0)+saltArrived; addQuestProgress('buysalt', saltArrived); msg+=' · 🧂+'+saltArrived; }
    if (knifeArrived>0) { state.knife=(state.knife||0)+knifeArrived; addQuestProgress('buyknife', knifeArrived); msg+=' · 🔪+'+knifeArrived; }
    showNotif(msg);
    state.delivery=null; updateUI(); save();
    if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }
  if (state.delivery2 && Date.now()>=state.delivery2.endsAt) {
    state.coins=Math.round((state.coins+state.delivery2.earnings)*100)/100;
    state.totalEarned=Math.round((state.totalEarned+state.delivery2.earnings)*100)/100;
    addQuestProgress('earn', state.delivery2.earnings);
    queueAction({type:'collect_delivery', via:'driver'});
    flushActions();
    var d2salt=state.delivery2.saltOrder||0;
    var d2knife=state.delivery2.knifeOrder||0;
    var d2msg='🧑‍✈️ Водитель вернулся! +🪙'+fmt(state.delivery2.earnings);
    if (d2salt>0) { state.salt=(state.salt||0)+d2salt; addQuestProgress('buysalt', d2salt); d2msg+=' · 🧂+'+d2salt; }
    if (d2knife>0) { state.knife=(state.knife||0)+d2knife; addQuestProgress('buyknife', d2knife); d2msg+=' · 🔪+'+d2knife; }
    showNotif(d2msg);
    state.delivery2=null; updateUI(); save();
    if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }
  if (currentTab==='market') renderMarket();
}
function tick() {
  try {
    var now=Date.now(), dt=(now-lastAuto)/1000; lastAuto=now;
    if (state.autoPerMin>0 || state.boosts.doubleTap>Date.now()) {
      var autoBase = state.autoPerMin + (state.boosts.doubleTap>Date.now() ? 2 : 0);
      autoAccum += autoBase * dt / 60;
      if (autoAccum >= 0.01) {
        var pay = Math.floor(autoAccum * 100) / 100;
        state.coins = Math.round((state.coins + pay) * 100) / 100;
        state.totalEarned = Math.round((state.totalEarned + pay) * 100) / 100;
        autoAccum -= pay;
        updateUI(); save();
      }
    }
    checkDeaths(); checkDelivery(); checkDrying(); checkSalting(); checkCutting();
    uploadScore();
    checkRareFish();
    updateRareFishUI();
    if (Date.now()-lastPriceUpdate>=PRICE_INTERVAL) updatePrices();
    updateWeatherUI();
    var te=document.getElementById('mkt-timer');
    if (te) te.textContent=Math.max(0,Math.ceil((lastPriceUpdate+PRICE_INTERVAL-Date.now())/1000))+t('с','s');
    var rte=document.getElementById('rental-timer');
    if (rte) {
      var rLeft = state.boosts.truckRental - Date.now();
      if (rLeft > 0) {
        var rh2=Math.floor(rLeft/3600000), rm2=Math.floor((rLeft%3600000)/60000);
        rte.textContent = rh2+t('ч ','h ')+rm2+t('м','m');
      } else if (currentTab==='market') {
        renderMarket(); // аренда истекла — перерисовать, чтобы вернулась кнопка "Арендовать"
      }
    }
    var lte=document.getElementById('lottery-ad-timer');
    if (lte) {
      var lLeft = 3600000 - (Date.now() - (state.lastAdLotterySpin||0));
      if (lLeft > 0) {
        lte.textContent = fmtTime(Math.ceil(lLeft/1000));
      } else if (currentTab==='boosts') {
        renderBoosts(); // кулдаун истёк — перерисовать, чтобы кнопка снова стала активной (📺)
      }
    }
  } catch(e) { console.error('tick error:', e); }
  setTimeout(tick,500);
}

// ── Запуск ────────────────────────────────────────────
applyStaticTranslations();
load();
calcStats();
processOffline();
save();
initFirebase();
setTimeout(loadWeather, 2000);
setTimeout(listenWeather, 2000);
setTimeout(loadRareFish, 3000);
setTimeout(listenRareFish, 3000);

// Загружаем из Firebase и сравниваем с localStorage по lastSeen
function loadFromFirebase(callback) {
  if (!firebaseDB) { callback(); return; }
  var pid = getPlayerId();
  if (!pid || pid.startsWith('p_')) { callback(); return; } // только для Telegram пользователей
  firebaseDB.ref('saves/' + pid).once('value', function(snap) {
    var fbData = snap.val();
    if (!fbData) { callback(); return; }
    var localRaw = localStorage.getItem(SAVE_KEY);
    var localData = localRaw ? JSON.parse(localRaw) : null;
    var fbTime = fbData.lastSeen || 0;
    var localTime = localData ? (localData.lastSeen || 0) : 0;
    if (fbTime > localTime) {
      // Firebase новее — применяем его данные
      applyState(fbData);
      localStorage.setItem(SAVE_KEY, JSON.stringify(fbData));
      calcStats();
      processOffline();
      save();
      updateUI();
      showNotif(t('🔄 Прогресс синхронизирован с облака','🔄 Progress synced from the cloud'));
    }
    callback();
  }, function() { callback(); });
}

function applyState(s) {
  s = migrate(s);
  state.coins  = s.coins  || 0;
  state.caught = s.caught || 0;
  state.currentLoc        = s.loc   || 'pond';
  state.unlockedLocs      = s.ulocs || ['pond'];
  state.unlockedFish      = s.ufish || {pond:['Карась']};
  state.caughtFish        = s.cfish || {};
  state.liveFish          = s.live  || [];
  state.transport         = s.transport || 'bike';
  state.delivery          = s.delivery  || null;
  state.delivery2         = s.delivery2 || null;
  state.unlockedTransports= s.unlockedTransports || ['bike'];
  state.durability        = s.durability || {bike:100,moped:100,car:100,truck:100};
  state.dailyDay          = s.dailyDay  || 0;
  state.dailyLastClaim    = s.dailyLastClaim || 0;
  state.lastSeen          = s.lastSeen  || Date.now();
  state.totalEarned       = s.totalEarned || 0;
  state.drying            = s.drying    || [];
  state.driedFish         = s.driedFish || [];
  state.boosts            = s.boosts    || {doubleTap:0,turboDry:false,luckyRod:0,turboSpeed:0,truckRental:0};
    state.truckTickets       = s.truckTickets || 0;
    state.premiumFreeSpinDate = s.premiumFreeSpinDate || 0;
    state.premiumFreeRepairDate = s.premiumFreeRepairDate || 0;
    state.energy = (typeof s.energy==="number") ? s.energy : 100;
    state.lastEnergyUpdate = s.lastEnergyUpdate || Date.now();
    state.lastAdEnergyRefill = s.lastAdEnergyRefill || 0;
    state.lastAdLotterySpin = s.lastAdLotterySpin || 0;
    state.fishSinceEnergySpend = s.fishSinceEnergySpend || 0;
  state.quests            = s.quests       || [];
  state.questsDate        = s.questsDate   || 0;
  state.questProgress     = s.questProgress|| {};
  state.salt              = s.salt         || 0;
  state.saltOrder         = s.saltOrder    || 0;
  state.salting           = s.salting      || [];
  if (!Array.isArray(state.salting)) state.salting = [];
  state.knife             = s.knife        || 0;
  state.knifeOrder        = s.knifeOrder   || 0;
  state.cutting           = s.cutting      || [];
  state.filets            = s.filets       || [];
  state.playerName        = s.playerName   || '';
  if (s.upgLevels && typeof s.upgLevels === 'object') {
    state.upgLevels = s.upgLevels;
  } else if (s.upg) {
    state.upgLevels = {};
    state.upgLevels[state.currentLoc] = s.upg;
  } else {
    state.upgLevels = {};
  }
  syncUpgradesToLoc();
  if (s.saltByLoc && typeof s.saltByLoc === 'object') {
    state.saltByLoc = s.saltByLoc;
  } else {
    state.saltByLoc = {};
    state.saltByLoc[state.currentLoc] = s.salt || 0;
  }
  if (s.knifeByLoc && typeof s.knifeByLoc === 'object') {
    state.knifeByLoc = s.knifeByLoc;
  } else {
    state.knifeByLoc = {};
    state.knifeByLoc[state.currentLoc] = s.knife || 0;
  }
  loadSaltKnifeFromLoc();
  for (var j=0;j<LOCATIONS.length;j++) { if(state.unlockedLocs.indexOf(LOCATIONS[j].id)>=0) LOCATIONS[j].unlocked=true; }
  if (s.prices)  marketPrices    = s.prices;
  if (s.priceTs) lastPriceUpdate = s.priceTs;
}

function startGame() {
  checkPremiumStatus();
  setInterval(checkPremiumStatus, 60000);

  setTimeout(function() {
    loadFromFirebase(function() {
      checkPendingBoosts();
      checkNameInput();
      setTimeout(checkDailyNews, 1500);
      checkTournament();
      setInterval(checkTournament, 60000);
      setInterval(updateTournamentBanner, 30000);
      checkRefContest();
      setInterval(checkRefContest, 60000);
      setInterval(updateRefContestBanner, 30000);
    });
  }, 800);

  initPrices();
  if (!lastPriceUpdate) { updatePrices(); lastPriceUpdate=Date.now(); }
  calcStats();
  var il=getLoc();
  var oc=document.getElementById('ocean');
  oc.style.background=il.bg; oc.style.borderBottomColor=il.border;
  document.getElementById('loc-label').textContent=il.emoji+' '+locName(il.id);
  for (var bi=0;bi<LOCATIONS.length;bi++) if(state.unlockedLocs.indexOf(LOCATIONS[bi].id)>=0) LOCATIONS[bi].unlocked=true;
  spawnBubbles(); renderLocBar(); updateUI(); setTimeout(tick,500);
}

if (userId && firebaseDB) {
  firebaseDB.ref('banned/' + userId).once('value', function(snap) {
    if (snap.val()) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px;color:#fff">'
        + '<div><div style="font-size:48px;margin-bottom:16px">🚫</div>'
        + '<div style="font-size:16px;font-weight:600">Доступ ограничен</div>'
        + '<div style="font-size:13px;color:#90caf9;margin-top:8px">Обратитесь к администратору, если считаете это ошибкой.</div></div></div>';
    } else {
      startGame();
    }
  });
} else {
  startGame();
}
</script>
