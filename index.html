.btn:disabled{background:#333;color:#666;cursor:not-allowed}

// ── Проверка режима обслуживания ────────────────────────────────
// Читаем config/maintenance ДО того, как загрузится сама игра.
// Если включено — показываем заглушку и останавливаем выполнение остального скрипта.
(function(){
  var LANG_MT = (navigator.language||'ru').indexOf('ru')===0 ? 'ru' : 'en';
  fetch('https://fishfarm-3a4f8-default-rtdb.firebaseio.com/config/maintenance.json')
    .then(function(r){ return r.json(); })
    .then(function(v){
      if (v && v.on) {
        document.documentElement.innerHTML =
          '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e;color:#eee;font-family:-apple-system,sans-serif;text-align:center;padding:24px">'
          +'<div>'
          +'<div style="font-size:48px;margin-bottom:16px">🔧</div>'
          +'<div style="font-size:18px;font-weight:700;margin-bottom:8px">'+(LANG_MT==='ru'?'Технические работы':'Under maintenance')+'</div>'
          +'<div style="font-size:14px;color:#90caf9;max-width:320px">'+(LANG_MT==='ru'
            ? (v.message || 'Мы недолго проводим технические работы. Игра скоро вернётся, прогресс сохранён!')
            : (v.message_en || 'We\'re running a short maintenance. The game will be back soon, your progress is safe!'))+'</div>'
          +'</div></body>';
        throw new Error('maintenance mode — stop loading game');
      }
    })
    .catch(function(e){ if (e && e.message==='maintenance mode — stop loading game') throw e; /* если Firebase недоступен — пускаем игру дальше, не блокируем игроков */ });
})();

<script>
// Принудительно сохраняем в Firebase при сворачивании/закрытии,
// чтобы debounce (2с) не терял последние действия перед выходом
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden' && window._fbSaveTimer && firebaseDB) {
    clearTimeout(window._fbSaveTimer);
    window._fbSaveTimer = null;
    flushFirebaseSave(window._pendingFbSave);
  }
});
// Скрываем клавиатуру при тапе вне текстового поля —
// в WebView Telegram это не происходит само по себе
document.addEventListener('touchstart', function(e) {
  var active = document.activeElement;
  var isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
  if (isInput && e.target !== active) {
    active.blur();
  }
}, {passive: true});

var tg = window.Telegram && window.Telegram.WebApp;
var userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;
var LANG = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === 'ru') ? 'ru' : 'en';
try {
  var langOverride = localStorage.getItem('fishfarm_lang_override');
  if (langOverride === 'ru' || langOverride === 'en') LANG = langOverride;
} catch(e) {}
// t('русский текст', 'english text') — возвращает нужный вариант по языку игрока (авто из Telegram)
function t(ru, en) {
  return LANG === 'en' ? (en!==undefined ? en : ru) : ru;
}
function setLanguage(lang) {
  LANG = lang;
  try { localStorage.setItem('fishfarm_lang_override', lang); } catch(e) {}
  applyStaticTranslations();
  updateEnergyBar();
  renderContent();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
function applyStaticTranslations() {
  var map = {
    'hint-text': t('Тапай чтобы ловить рыбу!', 'Tap to catch fish!'),
    'lbl-coins': t('🪙 монет', '🪙 coins'),
    'lbl-live': t('🐠 живых', '🐠 alive'),
    'lbl-tap': t('за улов', 'per catch'),
    'lbl-auto': t('🪙 авто/мин', '🪙 auto/min'),
    'bank-banner-title': t('Банк FishFarm', 'FishFarm Bank'),
    'bank-banner-sub': t('Обменяй монеты на 💎 GRAM за ⭐', 'Exchange coins for 💎 GRAM with ⭐'),

  };
  for (var id in map) { var el=document.getElementById(id); if(el) el.textContent=map[id]; }
}

  tg.ready();
  tg.expand();
  if (tg.requestFullscreen) tg.requestFullscreen();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  // Активируем буст при возврате в игру после оплаты через бота
  tg.onEvent('invoiceClosed', function(data) {
    if (data && data.status === 'paid' && data.url) {
      var url = data.url;
      var boostMatch = url.match(/boost[_=](\w+)/);

  });
}

var RARE_FISH = {name:'Осетрина', emoji:'🫍', price: 25, life: 0.33}; // цена 25🪙, живёт 10мин

var RARE_FISH_DURATION = 10 * 60 * 1000;     // живёт 10 минут
var rareFishActive = false;
var rareFishEndsAt = 0;
var rareFishNextAt = 0;

function loadRareFish() {
  if (!firebaseDB) return;
  firebaseDB.ref('rare_fish').once('value', function(snap) {
    var d = snap.val();
    var now = Date.now();
    if (!d) {
      // Первый раз — планируем первое появление через 2 часа
      rareFishNextAt = now + RARE_FISH_INTERVAL;
      firebaseDB.ref('rare_fish').set({nextAt: rareFishNextAt, active: false, endsAt: 0});
      return;
    }
    rareFishNextAt = d.nextAt || 0;
    rareFishEndsAt = d.endsAt || 0;
    if (d.active && rareFishEndsAt > now) {
      rareFishActive = true;
      showNotif(t('🫍 Осетрина рядом! Успей поймать!','🫍 Sturgeon nearby! Catch it quick!'));
      updateRareFishUI();
    } else if (!d.active && now >= rareFishNextAt) {
      // Время появиться!
      spawnRareFish();
    }
  });
}

// Постоянный слушатель регистрируется ОДИН раз при старте (см. вызов ниже по файлу),
// а не при каждом вызове loadRareFish() — иначе слушатели копятся и тормозят игру.
function listenRareFish() {
  if (!firebaseDB) return;
  firebaseDB.ref('rare_fish').on('value', function(snap) {
    var d = snap.val();
    if (!d) return;
    var now = Date.now();
    var wasActive = rareFishActive;
    rareFishActive = d.active && d.endsAt > now;
    rareFishEndsAt = d.endsAt || 0;
    rareFishNextAt = d.nextAt || 0;
    if (!wasActive && rareFishActive) {
      showNotif(t('🫍 Редкая рыба появилась! Осетрина рядом!','🫍 Rare fish appeared! Sturgeon nearby!'));
    }
    updateRareFishUI();
  });
}

function spawnRareFish() {
  if (!firebaseDB) return;
  var now = Date.now();
  var endsAt = now + RARE_FISH_DURATION;
  var nextAt = now + RARE_FISH_INTERVAL;
  rareFishActive = true;
  rareFishEndsAt = endsAt;
  rareFishNextAt = nextAt;
  firebaseDB.ref('rare_fish').set({active: true, endsAt: endsAt, nextAt: nextAt});
}

function checkRareFish() {
  var now = Date.now();
  if (rareFishActive && now >= rareFishEndsAt) {
    rareFishActive = false;
    rareFishEndsAt = 0; // сбрасываем сразу — иначе updateRareFishUI() ниже увидит "просроченный"
                         // rareFishEndsAt>0 и запустит гонку с ещё не подтверждённой записью в Firebase
    // Если истекла — планируем следующую
    if (firebaseDB) {
      var nextAt = now + RARE_FISH_INTERVAL;
      rareFishNextAt = nextAt;
      firebaseDB.ref('rare_fish').set({active: false, endsAt: 0, nextAt: nextAt});
    }
    updateRareFishUI();
  } else if (!rareFishActive && rareFishNextAt > 0 && now >= rareFishNextAt) {
    spawnRareFish();
  }
}

function updateRareFishUI() {
  var el = document.getElementById('rare-fish-indicator');
  if (!el) return;
  if (rareFishActive) {
    el.style.display = 'block';
    el.textContent = '🫍';
  } else {
    el.style.display = 'none';
  }
  if (Date.now() > rareFishEndsAt && rareFishEndsAt > 0) {
    rareFishEndsAt = 0; // сбрасываем сразу, чтобы не вызывать loadRareFish() на каждом тике
    loadRareFish();
  }
}

function getWeatherById(id) {
  for (var i=0;i<WEATHER_TYPES.length;i++) if(WEATHER_TYPES[i].id===id) return WEATHER_TYPES[i];
  return WEATHER_TYPES[0];
}

function randomWeather() {
  var total = WEATHER_TYPES.reduce(function(s,w){return s+w.weight;},0);
  var r = Math.random()*total, acc=0;
  for (var i=0;i<WEATHER_TYPES.length;i++) {
    acc+=WEATHER_TYPES[i].weight;
    if (r<=acc) return WEATHER_TYPES[i];
  }
  return WEATHER_TYPES[0];
}

function loadWeather() {
  if (!firebaseDB) return;
  firebaseDB.ref('weather').once('value', function(snap) {
    var w = snap.val();
    var now = Date.now();
    if (w && w.endsAt > now) {
      currentWeather = getWeatherById(w.id);
      weatherEndsAt = w.endsAt;
    } else {
      // Генерируем новую погоду
      var nw = randomWeather();
      var endsAt = now + WEATHER_DURATION;
      currentWeather = nw;
      weatherEndsAt = endsAt;
      firebaseDB.ref('weather').set({id:nw.id, endsAt:endsAt});
      showNotif(nw.emoji + ' ' + t('Погода изменилась: ','Weather changed: ') + weatherName(nw.id));
    }
    updateWeatherUI();
  });
}

// ── Утилиты ───────────────────────────────────────────
function fmt(c) {
  if (typeof c !== 'number' || isNaN(c)) return '0';
  if (c >= 1000000) return (c/1000000).toFixed(2)+'M';
  if (c >= 10000) return (c/1000).toFixed(1)+'k';
  return c.toFixed(1);
}
// Для крупных "круглых" цен (транспорт, локации) — без лишнего ".0", просто 5k/50k/300k.
function fmtCost(c) {
  if (typeof c !== 'number' || isNaN(c)) return '0';
  if (c >= 1000000) { var m = c/1000000; return (m%1===0 ? m : m.toFixed(1))+'M'; }
  if (c >= 1000) { var k = c/1000; return (k%1===0 ? k : k.toFixed(1))+'k'; }
  return String(c);
}
function fmtTime(s) {
  var m = Math.floor(s/60); var r = s%60;
  if (LANG === 'en') return m>0 ? (m+'m'+(r>0?' '+r+'s':'')) : s+'s';
  return m>0 ? (m+'мин'+(r>0?' '+r+'с':'')) : s+'с';
}
function getLoc(id) {
  var lid = id||state.currentLoc;
  for (var i=0;i<LOCATIONS.length;i++) if (LOCATIONS[i].id===lid) return LOCATIONS[i];
  return LOCATIONS[0];
}
// Множитель самой продвинутой РАЗЛОЧЕННОЙ локации игрока (не текущей!) —
// используется для ежедневных бонусов и квестов, чтобы прогресс игрока не зависел
// от того, в какой локации он физически стоит в момент получения награды
var ENERGY_REGEN_SEC = 126; // 3.5 часа на полный бак (100 энергии)
function getEnergyMax() {
  return isPremiumActive() ? 150 : 100;
}
function syncEnergy() {
  var max = getEnergyMax();
  if (state.energy >= max) { state.energy = max; state.lastEnergyUpdate = Date.now(); return; }
  var now = Date.now();
  var elapsedSec = (now - (state.lastEnergyUpdate||now)) / 1000;
  // Дробная регенерация — ровно как на сервере (energy/сек = 1/ENERGY_REGEN_SEC), без округления
  // вниз до целых. Раньше здесь было Math.floor(), что расходилось с сервером после каждой
  // синхронизации и постепенно "теряло" накопленную дробную часть энергии.
  var gained = elapsedSec / ENERGY_REGEN_SEC;
  if (gained > 0) {
    state.energy = Math.min(max, Math.round((state.energy + gained) * 1000) / 1000);
    state.lastEnergyUpdate = now;
  }
}
function hasEnergy() {
  syncEnergy();
  return state.energy >= 1/3; // >0 не годится — сервер списывает ровно 1/3 за улов и отклонит
                               // тап, если дробного остатка не хватает даже на один улов
}
function spendEnergyForCatch() {
  // Дробное списание — ровно как на сервере (1/3 за каждый улов), чтобы счётчики никогда
  // не расходились. Раньше здесь был отдельный "счётчик до третьего улова" с целыми числами,
  // который постепенно расходился с сервером после каждой синхронизации и пропускал лишние уловы.
  state.energy = Math.max(0, Math.round((state.energy - 1/3) * 1000) / 1000);
}
function maxUnlockedMult() {
  var best = 1;
  for (var i=0;i<state.unlockedLocs.length;i++) {
    var loc = getLoc(state.unlockedLocs[i]);
    if (loc && loc.tapMult > best) best = loc.tapMult;
  }
  return best;
}
// Порядковый номер (1-5) самой продвинутой открытой локации — зеркалит get_location_order() на бэке,
// используется только для ОТОБРАЖЕНИЯ цены лотереи; реальную цену всё равно считает сервер.
var LOCATION_ORDER = {pond:1, river:2, tropics:3, deep:4, space:5};
function maxUnlockedOrder() {
  var best = 1;
  for (var i=0;i<state.unlockedLocs.length;i++) {
    var o = LOCATION_ORDER[state.unlockedLocs[i]] || 1;
    if (o > best) best = o;
  }
  return best;
}
// Комиссия банка растёт вместе с самой продвинутой открытой локацией — как и курс обмена
function bankFeeAmount() {
  var base = isPremiumActive() ? 3 : 5;
  return base * maxUnlockedMult();
}
function starsWord(n) {
  if (LANG === 'en') return n === 1 ? 'star' : 'stars';
  var n10 = n % 10, n100 = n % 100;
  if (n100 >= 11 && n100 <= 14) return 'звёзд';
  if (n10 === 1) return 'звезда';
  if (n10 >= 2 && n10 <= 4) return 'звезды';
  return 'звёзд';
}
// Рыба принадлежит той локации, где была поймана — на рынке другой локации она не отображается
function fishBelongsToLoc(name, locId) {
  var list = FISH[locId||state.currentLoc] || [];
  for (var i=0;i<list.length;i++) if (list[i].name===name) return true;
  return false;
}
function getTr(id) {
  var tid = id||state.transport;
  if (tid === 'rentalTruck') {
    return (state.boosts.truckRental > Date.now()) ? RENTAL_TRUCK : TRANSPORTS[0];
  }
  for (var i=0;i<TRANSPORTS.length;i++) if (TRANSPORTS[i].id===tid) return TRANSPORTS[i];
  return TRANSPORTS[0];
}
function getDur(id) {
  var d = state.durability[id||state.transport];
  return (d === undefined || d === null) ? 100 : d;
}
function durColor(d) { return d>=75?'#6ddc6d':d>=50?'#FFD700':d>=25?'#ff9944':'#f44336'; }
function delivTime(tr) {
  var d=getDur(tr.id);
  var m=d>=75?1:d>=50?1.2:d>=25?1.5:2;
  var speedBoost=(state.boosts.turboSpeed>Date.now())?0.5:1; // ×2 скорость = ×0.5 время
  return Math.round(tr.time*m*speedBoost);
}

// ── Цены ─────────────────────────────────────────────
function initPrices() {
  for (var n in BASE_PRICES) {
    if (!marketPrices[n]) marketPrices[n]={cur:BASE_PRICES[n],prev:BASE_PRICES[n],trend:0};
  }
  fetchRealPrices();
}
// Цены рынка теперь считает только сервер (в bot.py, при продаже) — раньше клиент
// параллельно вёл свою собственную случайную симуляцию, из-за чего показанная при
// отправке доставки сумма расходилась с тем, что реально начислялось при получении.
// Здесь просто читаем то же самое место в Firebase, откуда берёт цены сам сервер.
function fetchRealPrices() {
  if (!firebaseDB) return;
  firebaseDB.ref('market/prices').once('value', function(snap) {
    var d = snap.val();
    if (!d || !d.cur) return;
    for (var n in d.cur) {
      if (!marketPrices[n]) marketPrices[n] = {cur:BASE_PRICES[n]||1, prev:BASE_PRICES[n]||1, trend:0};
      var newVal = d.cur[n];
      marketPrices[n].trend = newVal>marketPrices[n].cur ? 1 : newVal<marketPrices[n].cur ? -1 : 0;
      marketPrices[n].prev = marketPrices[n].cur;
      marketPrices[n].cur = newVal;
    }
    lastPriceUpdate = d.ts || Date.now();
    if (currentTab==='market') renderMarket();
  });
}
function updatePrices() {
  fetchRealPrices();
}

// ── Сохранение ────────────────────────────────────────
// ── Версия сохранения ─────────────────────────────────
// Меняй SAVE_VERSION когда структура данных несовместима.
// Добавляй миграцию в migrate() чтобы не терять прогресс игроков.
var SAVE_VERSION = 1;
var SAVE_KEY = 'ff_save';
var dryPacks = {};
var filetPacks = {};

function migrate(s) {
  var v = s.version || 0;

  // Миграция с версии 0 (старые ключи ff3/ff4/ff5) → версия 1
  if (v < 1) {
    // Подтягиваем старые сохранения из ff5/ff4/ff3
    if (!s.coins && !s.caught) {
      var old = JSON.parse(localStorage.getItem('ff5') || localStorage.getItem('ff4') || localStorage.getItem('ff3') || 'null');
      if (old) {
        s.coins  = old.coins  || 0;
        s.caught = old.caught || 0;
        s.loc    = old.loc    || 'pond';
        s.ulocs  = old.ulocs  || ['pond'];
        s.ufish  = old.ufish  || {pond:['Карась']};
        s.cfish  = old.cfish  || {};
        s.live   = old.live   || [];
        s.transport  = old.transport  || 'bike';
        s.delivery   = old.delivery   || null;
        s.unlockedTransports = old.utrans     || ['bike'];
        s.durability         = old.dur        || {bike:100,moped:100,car:100,truck:100};
        s.dailyDay   = old.dailyDay   || 0;
        s.dailyLastClaim = old.dailyLast || 0;
        s.lastSeen   = old.lastSeen   || Date.now();
        s.upg        = old.upg        || {};
        s.prices     = old.prices     || {};
        s.priceTs    = old.priceTs    || 0;
        // Удаляем старые ключи
        localStorage.removeItem('ff5');
        localStorage.removeItem('ff4');
        localStorage.removeItem('ff3');
      }
    }
    s.version = 1;
  }

  // Сюда добавляй будущие миграции:
  // if (v < 2) { s.newField = defaultValue; s.version = 2; }
  if (v < 2) {
    s.salt      = s.salt      || 0;
    s.saltOrder = s.saltOrder || 0;
    s.salting   = s.salting   || [];
    s.quests    = s.quests    || [];
    s.questsDate= s.questsDate|| 0;
    s.questProgress = s.questProgress || {};
    s.version = 2;
  }
  // if (v < 3) { ... s.version = 3; }

  return s;
}

function flushFirebaseSave(saveData) {
  if (!firebaseDB || !saveData) return;
  try {
    var pid = getPlayerId();
    // update(), а не set() — saveData больше не содержит coins/caught/totalEarned/energy
    // (их пишет только bot.py через /sync), и set() стёр бы эти поля как отсутствующие.
    firebaseDB.ref('saves/' + pid).update(saveData)
      .then(function(){
        if (window._fbSaveHadError) {
          window._fbSaveHadError = false;
          firebaseDB.ref('sync_errors/' + pid).remove();
        }
      })
      .catch(function(err){ logFirebaseSaveError(pid, err); });
  } catch(err) { logFirebaseSaveError(getPlayerId(), err); }
}

function logFirebaseSaveError(pid, err) {
  window._fbSaveHadError = true;
  console.error('Ошибка сохранения в Firebase:', err);
  try {
    firebaseDB.ref('sync_errors/' + pid).set({
      message: (err && err.message) || String(err),
      ts: Date.now()
    });
  } catch(e) {}
}

function save() {
  try {
    saveSaltKnifeToLoc(); // фиксируем склад текущей локации перед сохранением
    var upg={};
    for (var i=0;i<UPGRADES.length;i++) upg[UPGRADES[i].id]=UPGRADES[i].bought;
    var saveData = {
      version: SAVE_VERSION,
      coins:state.coins, caught:state.caught,
      loc:state.currentLoc, ulocs:state.unlockedLocs,
      ufish:state.unlockedFish, cfish:state.caughtFish, live:state.liveFish,
      transport:state.transport, delivery:state.delivery, delivery2:state.delivery2,
      unlockedTransports:state.unlockedTransports, durability:state.durability,
      dailyDay:state.dailyDay, dailyLastClaim:state.dailyLastClaim,
      lastSeen:Date.now(), totalEarned:state.totalEarned, upg:upg, upgLevels:state.upgLevels, prices:marketPrices, priceTs:lastPriceUpdate,
      drying:state.drying, driedFish:state.driedFish, boosts:state.boosts,
      quests:state.quests, questsDate:state.questsDate, questProgress:state.questProgress,
      salt:state.salt, saltOrder:state.saltOrder, salting:state.salting,
      knife:state.knife, knifeOrder:state.knifeOrder, cutting:state.cutting, filets:state.filets,
      saltByLoc:state.saltByLoc, knifeByLoc:state.knifeByLoc, truckTickets:state.truckTickets, premiumFreeSpinDate:state.premiumFreeSpinDate, premiumFreeRepairDate:state.premiumFreeRepairDate,
      energy:state.energy, lastEnergyUpdate:state.lastEnergyUpdate, lastAdEnergyRefill:state.lastAdEnergyRefill, lastAdLotterySpin:state.lastAdLotterySpin, fishSinceEnergySpend:state.fishSinceEnergySpend,
      playerName:state.playerName
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    // Firebase пишем с debounce — не чаще раза в 2с, чтобы частые тапы не заваливали сеть запросами.
    // coins/caught/totalEarned/energy ИСКЛЮЧАЕМ из этой записи — их пишет только bot.py через /sync
    // (правила Firebase запрещают клиенту трогать эти поля напрямую; если оставить их в объекте,
    // весь .set() целиком будет отклонён, и перестанет сохраняться вообще всё остальное).
    if (firebaseDB) {
      var fbSaveData = {};
      for (var fbKey in saveData) {
        if (fbKey==='coins' || fbKey==='caught' || fbKey==='totalEarned' || fbKey==='energy' || fbKey==='upgLevels' || fbKey==='lastEnergyUpdate' || fbKey==='unsoldCaught' || fbKey==='lastAdLotterySpin' || fbKey==='premiumFreeSpinDate' || fbKey==='unlockedTransports' || fbKey==='durability' || fbKey==='dailyDay' || fbKey==='dailyLastClaim' || fbKey==='comebackClaimedAt' || fbKey==='questBonusDate' || fbKey==='ulocs' || fbKey==='deliveryEscrow' || fbKey==='deliveryEscrow2') continue;
        fbSaveData[fbKey] = saveData[fbKey];
      }
      window._pendingFbSave = fbSaveData;
      if (window._fbSaveTimer) clearTimeout(window._fbSaveTimer);
      window._fbSaveTimer = setTimeout(function(){
        flushFirebaseSave(window._pendingFbSave);
        window._fbSaveTimer = null;
      }, 2000);
    }
    // Денежные поля (coins/caught/totalEarned/energy) теперь синкаем через bot.py,
    // который сверяет прирост с физически возможным потолком — раз в 8с с debounce.
    if (typeof BOT_API_URL !== 'undefined' && tg && tg.initData) {
      if (window._syncTimer) clearTimeout(window._syncTimer);
      window._syncTimer = setTimeout(function(){
        window._syncTimer = null;
        syncMoneyToServer();
      }, 8000);
    }
  } catch(e){}
}

function syncMoneyToServer() {
  if (!tg || !tg.initData) return;
  fetch(BOT_API_URL + '/sync', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      coins: state.coins,
      caught: state.caught,
      totalEarned: state.totalEarned,
      energy: state.energy,
      init_data: tg.initData
    })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (!res || !res.ok) return;
    // Сервер — источник правды. Если он что-то обрезал (clamped:true), тихо принимаем
    // его цифры, без пугающих игрока уведомлений — это редкий случай ложной подозрительности,
    // а не что-то, что нужно объяснять каждому.
    state.coins = res.coins;
    state.caught = res.caught;
    state.totalEarned = res.totalEarned;
    state.energy = res.energy;
    updateUI();
    localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign(
      JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'),
      {coins: state.coins, caught: state.caught, totalEarned: state.totalEarned, energy: state.energy}
    )));
  }).catch(function(){ /* сеть недоступна — следующий save() попробует снова */ });
}

    state.dailyLastClaim    = s.dailyLastClaim || 0;
    state.lastSeen          = s.lastSeen  || Date.now();

    state.premiumFreeSpinDate = s.premiumFreeSpinDate || 0;

    state.lastEnergyUpdate = s.lastEnergyUpdate || Date.now();
    state.lastAdEnergyRefill = s.lastAdEnergyRefill || 0;
    state.lastAdLotterySpin = s.lastAdLotterySpin || 0;
    state.fishSinceEnergySpend = s.fishSinceEnergySpend || 0;
    state.quests            = s.quests       || [];
    state.questsDate        = s.questsDate   || 0;
    state.questProgress     = s.questProgress|| {};
    state.salt              = s.salt         || 0;
    state.saltOrder         = s.saltOrder    || 0;
    state.salting           = s.salting      || [];
    if (!Array.isArray(state.salting)) state.salting = [];
    state.knife             = s.knife        || 0;
    state.knifeOrder        = s.knifeOrder   || 0;
    state.cutting           = s.cutting      || [];
    state.filets            = s.filets       || [];
    state.playerName        = s.playerName   || '';
    if (s.upgLevels && typeof s.upgLevels === 'object') {
      state.upgLevels = s.upgLevels;
    } else if (s.upg) {
      // Миграция со старого формата: прокачка была общей — оставляем её в текущей локации игрока
      state.upgLevels = {};
      state.upgLevels[state.currentLoc] = s.upg;
    } else {
      state.upgLevels = {};
    }
    syncUpgradesToLoc();
    if (s.saltByLoc && typeof s.saltByLoc === 'object') {
      state.saltByLoc = s.saltByLoc;
    } else {
      // Миграция: старый общий склад соли оставляем в текущей локации игрока
      state.saltByLoc = {};
      state.saltByLoc[state.currentLoc] = s.salt || 0;
    }
    if (s.knifeByLoc && typeof s.knifeByLoc === 'object') {
      state.knifeByLoc = s.knifeByLoc;
    } else {
      state.knifeByLoc = {};
      state.knifeByLoc[state.currentLoc] = s.knife || 0;
    }
    loadSaltKnifeFromLoc();
    for (var j=0;j<LOCATIONS.length;j++) { if(state.unlockedLocs.indexOf(LOCATIONS[j].id)>=0) LOCATIONS[j].unlocked=true; }
    if (s.prices)  marketPrices    = s.prices;
    if (s.priceTs) lastPriceUpdate = s.priceTs;
    // Сохраняем мигрированные данные сразу
    save();
  } catch(e){}
}

}

// ── Офлайн ────────────────────────────────────────────
function processOffline() {
  var now=Date.now(), last=state.lastSeen||now;
  var elapsed=now-last;
  if (elapsed<5000) return;

  // Комбэк-бонус для вернувшихся после долгого отсутствия
  if (!window._comebackShown) {
    window._comebackShown = true;
    var daysAway = elapsed / 86400000;
    var comebackCoins = 0;
    if (daysAway >= 14)      comebackCoins = 1000;
    else if (daysAway >= 7)  comebackCoins = 500;
    else if (daysAway >= 3)  comebackCoins = 200;
    if (comebackCoins > 0) {
      setTimeout(function(){ showComebackBonus(comebackCoins, Math.floor(daysAway)); }, 600);
    }
  }
  if (state.delivery && now>=state.delivery.endsAt) {
    state.coins=Math.round((state.coins+state.delivery.earnings)*100)/100;
    state.totalEarned=Math.round((state.totalEarned+state.delivery.earnings)*100)/100;
    addQuestProgress('earn', state.delivery.earnings);
    queueAction({type:'collect_delivery'});
    var saltArrived=state.delivery.saltOrder||0;
    var knifeArrived=state.delivery.knifeOrder||0;
    if (saltArrived>0) { state.salt=(state.salt||0)+saltArrived; addQuestProgress('buysalt', saltArrived); }
    if (knifeArrived>0) { state.knife=(state.knife||0)+knifeArrived; addQuestProgress('buyknife', knifeArrived); }
    var offMsg='💰 Доставка прибыла! +🪙'+fmt(state.delivery.earnings);
    if (saltArrived>0) offMsg+=' · 🧂+'+saltArrived;
    if (knifeArrived>0) offMsg+=' · 🔪+'+knifeArrived;
    showNotif(offMsg);
    state.delivery=null;
  }
  if (state.delivery2 && now>=state.delivery2.endsAt) {
    state.coins=Math.round((state.coins+state.delivery2.earnings)*100)/100;
    state.totalEarned=Math.round((state.totalEarned+state.delivery2.earnings)*100)/100;
    addQuestProgress('earn', state.delivery2.earnings);
    queueAction({type:'collect_delivery', via:'driver'});
    var d2salt=state.delivery2.saltOrder||0;
    var d2knife=state.delivery2.knifeOrder||0;
    var d2msg='🧑‍✈️ Водитель вернулся! +🪙'+fmt(state.delivery2.earnings);
    if (d2salt>0) { state.salt=(state.salt||0)+d2salt; addQuestProgress('buysalt', d2salt); d2msg+=' · 🧂+'+d2salt; }
    if (d2knife>0) { state.knife=(state.knife||0)+d2knife; addQuestProgress('buyknife', d2knife); d2msg+=' · 🔪+'+d2knife; }
    showNotif(d2msg);
    state.delivery2=null;
  }
  if (state.autoPerMin > 0) {
    var autoEarned = Math.round(state.autoPerMin * elapsed / 1000 / 60 * 100) / 100;
    if (autoEarned > 0) {
      state.coins = Math.round((state.coins + autoEarned) * 100) / 100;
      state.totalEarned = Math.round((state.totalEarned + autoEarned) * 100) / 100;
      showNotif(t('🪙 Авто-доход за офлайн: +','🪙 Offline auto-income: +') + fmt(autoEarned));
    }
  }
  for (var d=0;d<state.drying.length;d++) {
    if (now>=state.drying[d].endsAt) state.drying[d].notified=true;
  }
  for (var c=0;c<(state.cutting||[]).length;c++) {
    if (now>=state.cutting[c].endsAt) state.cutting[c].notified=true;
  }
  // Убираем просроченную сушёную рыбу (6ч с момента endsAt)
  state.driedFish=state.driedFish.filter(function(f){ return f.dieAt>now; });
  // Убираем погибшую свежую рыбу
  var dead=[], live=[];
  for (var i=0;i<state.liveFish.length;i++) {
    if (state.liveFish[i].dieAt<=now) dead.push(state.liveFish[i]);
    else live.push(state.liveFish[i]);
  }
  if (dead.length) { state.liveFish=live; showNotif(t('💀 Пока тебя не было погибло ','💀 While you were away, ')+dead.length+t(' рыб!',' fish died!'),true); }
}

// ── Расчёты ───────────────────────────────────────────
function calcStats() {
  syncUpgradesToLoc();
  var tm=1, auto=0;
  var rodBought=0;
  for (var i=0;i<UPGRADES.length;i++) {
    var u=UPGRADES[i];
    if (u.id==='rod')   rodBought=u.bought;
    if (u.id==='net')   auto+=0.1*u.bought;
    if (u.id==='boat')  auto+=0.3*u.bought;
    if (u.id==='sonar') auto+=0.5*u.bought;
  }
  var lm=getLoc().tapMult||1;
  state.tapPower=Math.round(ROD_TAP[rodBought]*lm*10)/10;
  var premiumMult=isPremiumActive()?1.25:1;
  state.autoPerMin=Math.round(auto*lm*premiumMult*10)/10;
}
function catchChance() {
  var rod=null;
  for (var i=0;i<UPGRADES.length;i++) if(UPGRADES[i].id==='rod') rod=UPGRADES[i];
  var base=Math.min(0.65,0.20+(rod?rod.bought:0)*0.09);
  var lucky=(state.boosts.luckyRod>Date.now())?1.5:1;
  // Фиксированные множители по настроению
  var mult;
  if (scareFactor>=0.9)      mult=1.0;   // 😊 спокойная
  else if (scareFactor>=0.6) mult=0.5;   // 😐 насторожена ~50%
  else if (scareFactor>=0.3) mult=0.17;  // 😨 напугана ~5% от базы
  else                       mult=0.05;  // 😱 в панике ~1% от базы
  return Math.min(0.95, Math.round(base*mult*lucky*(currentWeather.catchMult||1)*100)/100);
}
function updateScare() {
  var now=Date.now(), ntimes=[];
  for (var i=0;i<tapTimes.length;i++) if(now-tapTimes[i]<1000) ntimes.push(tapTimes[i]);
  tapTimes=ntimes;
  var tps=tapTimes.length;
  if (tps<=3) scareFactor=Math.min(1.0,scareFactor+0.05);
  else if (tps<=MAX_TPS) scareFactor=Math.max(0.5,scareFactor-0.03);
  else scareFactor=Math.max(0.05,scareFactor-0.15);
}
function unlockFish() {
  var loc=state.currentLoc;
  if (!state.unlockedFish[loc]) state.unlockedFish[loc]=[];
  var fish=FISH[loc]||[];
  for (var i=0;i<fish.length;i++) {
    if (state.unlockedFish[loc].indexOf(fish[i].name)<0 && state.coins>=fish[i].need)
      state.unlockedFish[loc].push(fish[i].name);
  }
}
function randFish() {
  var loc=state.currentLoc;
  var all=FISH[loc]||[];
  var pool=[];
  for (var i=0;i<all.length;i++) if((state.unlockedFish[loc]||[]).indexOf(all[i].name)>=0) pool.push(all[i]);
  if (!pool.length) return all[0]||{emoji:'🐟',name:'Рыба',life:1};
  var tot=0; for (var j=0;j<pool.length;j++) tot+=pool[j].rate;
  var r=Math.random()*tot;
  for (var m=0;m<pool.length;m++) { r-=pool[m].rate; if(r<=0) return pool[m]; }
  return pool[0];
}
function calcEarnings(count) {
  var fish=state.liveFish.slice(0,count), total=0;
  for (var i=0;i<fish.length;i++) {
    var mp=marketPrices[fish[i].name]||{cur:BASE_PRICES[fish[i].name]||1};
    total+=mp.cur;
  }
  return Math.round(total*100)/100;
}

function showNotif(msg, dead) {
  // Сохраняем важные уведомления в историю
  var important = msg.indexOf('💰') >= 0 || msg.indexOf('💀') >= 0 ||
                  msg.indexOf('🪙 Авто') >= 0 || msg.indexOf('📦') >= 0 ||
                  msg.indexOf('🧂') >= 0 || msg.indexOf('🎁') >= 0 ||
                  msg.indexOf('🧑‍✈️') >= 0 || msg.indexOf('🚀') >= 0 || msg.indexOf('👥') >= 0 ||
                  msg.indexOf('🏆') >= 0 || msg.indexOf('🎰') >= 0 || msg.indexOf('💎') >= 0 || dead;
  if (important) {
    var time = new Date();
    var hm = ('0'+time.getHours()).slice(-2)+':'+('0'+time.getMinutes()).slice(-2);
    notifLog.unshift({msg:msg, time:hm, dead:!!dead});
    if (notifLog.length > 50) notifLog.pop();
    try { localStorage.setItem('ff_notiflog', JSON.stringify(notifLog)); } catch(e) {} // макс 50 записей

  var el=document.createElement('div');

}

function bulkSell(type) {
  if (type==='dried') {
    var restD=[], count=0;
    for (var di=0;di<state.driedFish.length;di++) {
      if (fishBelongsToLoc(state.driedFish[di].name)) count++;
      else restD.push(state.driedFish[di]);
    }
    if (!count) return;
    var lmB=(getLoc(state.currentLoc)||{}).tapMult||1;
    var earn=Math.round(count*0.03*lmB*100)/100;
    state.driedFish=restD;
    state.coins=Math.round((state.coins+earn)*100)/100;
    queueAction({type:'bulk_sell', loc: state.currentLoc, kind:'dried', qty: count});
    addQuestProgress('earn', earn);
    showNotif(t('💰 Продано ','💰 Sold ')+count+t(' пакетов · +🪙',' packs · +🪙')+earn);

}

function startCutting(name) {
  var grouped={};
  for (var i=0;i<state.liveFish.length;i++) { var n=state.liveFish[i].name; grouped[n]=(grouped[n]||0)+1; }
  var packs=filetPacks[name]||1, needed=packs*10;
  if ((grouped[name]||0)<needed) { showNotif(t('Нужно ','Need ')+needed+t(' рыб!',' fish!')); return; }
  if ((state.knife||0)<packs) { showNotif(t('🔪 Не хватает ножей! Нужно ','🔪 Not enough knives! Need ')+packs+t(', есть ',', have ')+(state.knife||0)); return; }
  var def=null; for (var k=0;k<ALL_FISH.length;k++) if(ALL_FISH[k].name===name) def=ALL_FISH[k];
  var taken=0, rest=[];
  for (var j=0;j<state.liveFish.length;j++) {
    if (state.liveFish[j].name===name && taken<needed) taken++;
    else rest.push(state.liveFish[j]);
  }
  state.liveFish=rest;
  state.knife-=packs;
  state.cutting.push({name:name,emoji:def?def.emoji:'🐟',packets:packs,startedAt:Date.now(),endsAt:Date.now()+7200000}); // 2 часа
  addQuestProgress('filet', packs);
  filetPacks[name]=1;
  showNotif('🔪 '+packs+t(' пак. ',' pack. ')+fishName(name)+t(' отправлено на разделку!',' sent for cutting!'));
  updateUI(); save();
  if(tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function startPacking(idx) {
  var slot=state.cutting[idx];
  if (!slot||Date.now()<slot.endsAt) return;
  var packTime = (DRY_TIME[slot.name] || 3600) * 1000;
  state.filets.push({name:slot.name,emoji:slot.emoji,packets:slot.packets,packingEndsAt:Date.now()+packTime});
  state.cutting.splice(idx,1);
  var packMin = Math.round(packTime/60000);
  var packLabel = packMin>=60 ? (Math.floor(packMin/60)+t('ч ','h ')+(packMin%60?packMin%60+t('м','m'):'')) : packMin+t('мин','m');
  showNotif('📦 '+fishName(slot.name)+t(' отправлена на упаковку — ',' sent for packing — ')+packLabel+'!');
  updateUI(); save();
}

function collectFilet(idx) {
  var slot=state.filets[idx];
  if (!slot||!slot.packingEndsAt||Date.now()<slot.packingEndsAt) return;
  var expiresAt = slot.packingEndsAt + 10800000; // 3 часа с момента окончания упаковки
  state.filets[idx]={name:slot.name,emoji:slot.emoji,packets:slot.packets,dieAt:expiresAt};
  showNotif('🍱 '+t('Филе','Filet')+' '+fishName(slot.name)+' '+t('готово! Продай на рынке.','ready! Sell it at the market.'));
  updateUI(); save();
  if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function startSalting(name) {
  var grouped={};
  for (var i=0;i<state.liveFish.length;i++) { var n=state.liveFish[i].name; grouped[n]=(grouped[n]||0)+1; }
  var packs=dryPacks[name]||1, needed=packs*10;
  if ((grouped[name]||0)<needed) { showNotif(t('Нужно ','Need ')+needed+t(' рыб!',' fish!')); return; }
  if (state.salt<packs) { showNotif(t('🧂 Не хватает соли! Нужно ','🧂 Not enough salt! Need ')+packs+t(', есть ',', have ')+state.salt); return; }
  var def=null; for (var k=0;k<ALL_FISH.length;k++) if(ALL_FISH[k].name===name) def=ALL_FISH[k];
  // Убираем рыбу со склада и списываем соль
  var taken=0, rest=[];
  for (var j=0;j<state.liveFish.length;j++) {
    if (state.liveFish[j].name===name && taken<needed) taken++;
    else rest.push(state.liveFish[j]);

function getTodayDate() {
  var d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function ruTimesWord(n) {
  // Склонение "раз/раза/раз" по числу — 1 раз, 2-4 раза, 5+ раз (кроме 11-14 — тоже "раз")
  var n10 = n % 10, n100 = n % 100;
  if (n10===1 && n100!==11) return 'раз';
  if (n10>=2 && n10<=4 && (n100<12 || n100>14)) return 'раза';
  return 'раз';
}
function generateQuests() {
  var today=getTodayDate();
  if (state.questsDate===today && state.quests.length===5) return;
  // Генерируем 5 случайных уникальных квестов
  var pool=QUEST_TEMPLATES.slice();
  var picked=[];
  // Перемешиваем с сидом от даты
  var seed=today;
  function rnd() { seed=(seed*1664525+1013904223)&0xffffffff; return Math.abs(seed)/0x80000000; }
  pool.sort(function(){ return rnd()-0.5; });
  for (var i=0;i<5&&i<pool.length;i++) picked.push(pool[i].id);
  state.quests=picked;
  state.questsDate=today;
  // Сбрасываем весь прогресс на новый день
  var newProgress={};
  for (var j=0;j<picked.length;j++) newProgress[picked[j]]=0;
  state.questProgress=newProgress;
  save();
}
function getQuest(id) {
  for (var i=0;i<QUEST_TEMPLATES.length;i++) if(QUEST_TEMPLATES[i].id===id) return QUEST_TEMPLATES[i];
  return null;
}
function addQuestProgress(type, amount) {
  generateQuests();
  var qMult=maxUnlockedMult();
  var changed=false;
  var allDoneBefore=true;
  for (var i=0;i<state.quests.length;i++) {
    var q=getQuest(state.quests[i]); if(!q) continue;
    var goal=Math.round(q.goal*qMult);
    if ((state.questProgress[q.id]||0) < goal) allDoneBefore=false;
  }
  if (allDoneBefore) return; // уже все выполнены

  for (var i=0;i<state.quests.length;i++) {
    var q=getQuest(state.quests[i]); if(!q) continue;
    var goal=Math.round(q.goal*qMult);
    if (q.type===type) {
      var prev=state.questProgress[q.id]||0;
      if (prev<goal) {
        state.questProgress[q.id]=Math.min(goal, prev+(amount||1));
        changed=true;
      }
    }
  }

  // Проверяем — все ли выполнены теперь
  if (changed) {
    var allDone=true;
    for (var j=0;j<state.quests.length;j++) {
      var qq=getQuest(state.quests[j]); if(!qq) continue;
      var qqGoal=Math.round(qq.goal*qMult);
      if ((state.questProgress[qq.id]||0)<qqGoal) { allDone=false; break; }
    }
    if (allDone) {
      var lm=maxUnlockedMult();
      var questBonus=Math.round(500*lm*100)/100;
      state.coins=Math.round((state.coins+questBonus)*100)/100;
      state.totalEarned=Math.round((state.totalEarned+questBonus)*100)/100;
      queueAction({type:'quest_bonus', loc: state.currentLoc});
      flushActions();
      showNotif(t('🏆 Все квесты выполнены! +🪙','🏆 All quests completed! +🪙')+fmt(questBonus), true);
      if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }
    updateUI(); save();
  }
}

  if (!refMarketCache) {
    fetchReferralMarket();
    html += '<div class="card" style="text-align:center;color:#90caf9">⏳ '+t('Загружаем список...','Loading list...')+'</div>';
    document.getElementById('content').innerHTML = html;
    return;
  }

  var list = refMarketCache.players || [];
  var price = refMarketCache.price || 10;
  if (!list.length) {
    html += '<div class="card" style="text-align:center;color:#90caf9">'+t('Сейчас никого нет в продаже — загляни позже.','No one is up for sale right now — check back later.')+'</div>';
  } else {
    for (var i=0;i<list.length;i++) {
      var p = list[i];
      var daysAgo = p.lastSeen ? Math.floor((Date.now()-p.lastSeen)/86400000) : null;
      var activityStr = daysAgo===null ? t('давно','a while ago') : daysAgo===0 ? t('сегодня','today') : t(daysAgo+'д назад', daysAgo+'d ago');
      html += '<div class="card" style="display:flex;align-items:center;gap:10px">'
        +'<div style="flex:1">'
        +'<div style="font-size:14px;font-weight:600;color:#fff">@'+p.username+'</div>'
        +'<div style="font-size:11px;color:#90caf9">🪙 '+fmt(p.totalEarned||0)+' · 🐟 '+(p.caught||0)+' · 🕐 '+activityStr+'</div>'
        +'</div>'
        +'<button class="btn btn-gold" onclick="buyReferral(\''+p.uid+'\')">⭐ '+price+'</button>'
        +'</div>';
    }
  }
  document.getElementById('content').innerHTML = html;
}
function fetchReferralMarket() {
  if (refMarketLoading || !tg || !tg.initData || typeof BOT_API_URL === 'undefined') return;
  refMarketLoading = true;
  fetch(BOT_API_URL + '/referral_market_list', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({init_data: tg.initData})
  }).then(function(r){ return r.json(); }).then(function(res){
    refMarketLoading = false;
    if (res && res.ok) { refMarketCache = res; if (state.marketSubpage==='refmarket') renderReferralMarket(); }
  }).catch(function(){ refMarketLoading = false; });
}
function buyReferral(targetUid) {
  if (!tg || !tg.initData || typeof BOT_API_URL === 'undefined') return;
  showNotif(t('⏳ Создаём счёт...','⏳ Creating invoice...'));
  fetch(BOT_API_URL + '/invoice', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action:'buy_referral', target_uid: targetUid, init_data: tg.initData})
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
    .then(function(res){
      if (!res.ok || !res.data.link) { showNotif(t('❌ Ошибка: ','❌ Error: ')+(res.data&&res.data.error||t('неизвестная','unknown'))); return; }
      var invLink = res.data.link.replace('https://telegram.me/', 'https://t.me/');
      tg.openInvoice(invLink, function(status){
        if (status==='paid') {
          showNotif(t('✅ Куплено!','✅ Purchased!'));
          refMarketCache = null; // сбрасываем кэш, чтобы список обновился без уже купленного
          renderReferralMarket();
        }
      });
    }).catch(function(e){ showNotif(t('❌ Ошибка: ','❌ Error: ')+e.message); });
}

// Приз лотереи теперь ВСЕГДА решает сервер (pick_lottery_prize в bot.py) — рулетка
// на клиенте больше не крутится. Эта функция только отображает и локально применяет
// уже готовый результат (для мгновенного UI — реальные данные сервер уже записал сам).
function displayServerLotteryPrize(prize) {
  if (!prize) return;
  addQuestProgress('boost', 1);
  if (prize.kind === 'jackpot') {
    window._jackpotCache = 50;
    showLotteryResult('⭐ ДЖЕКПОТ!', prize.amount + ' Stars', '#FFD700', true);
    showNotif(t('⭐ ДЖЕКПОТ! Выигрыш ','⭐ JACKPOT! Won ')+prize.amount+t(' Stars — жди перевода от администратора!',' Stars — wait for admin transfer!'));
  } else {
    if (prize.kind === 'coins') {
      state.coins = Math.round((state.coins + prize.amount) * 100) / 100;
      state.totalEarned = Math.round((state.totalEarned + prize.amount) * 100) / 100;
    } else if (prize.kind === 'fish') {
      for (var fi=0; fi<prize.amount; fi++) {
        var rf=randFish();
        pushLiveFish({name:rf.name, emoji:rf.emoji, dieAt:Date.now()+3600000});
      }
      state.caught += prize.amount;
    } else if (prize.kind === 'salt') {
      state.salt = (state.salt||0) + prize.amount;
      addQuestProgress('buysalt', prize.amount);
    } else if (prize.kind === 'knife') {
      state.knife = (state.knife||0) + prize.amount;
      addQuestProgress('buyknife', prize.amount);
    } else if (prize.kind === 'truck_ticket') {
      state.truckTickets = (state.truckTickets||0) + 1;
      showNotif(t('🎫 Выигран билет на аренду грузовика! Используй его на Рынке','🎫 Won a truck rental ticket! Use it at the Market'));
    }
    showLotteryResult('🎰 Результат', prize.label, '#b794f6', false);
    showNotif(t('🎰 Лотерея: ','🎰 Lottery: ')+prize.label);
  }
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  // Джекпот на сервере мог измениться (вырос при проигрыше или сбросился при выигрыше) —
  // кэш на экране раньше обновлялся только в ветке самого выигрыша, поэтому после обычного
  // приза цифра "зависала" до перезахода. Обновляем всегда, при любом результате крутки.
  if (firebaseDB) {
    firebaseDB.ref('jackpot/amount').once('value', function(snap) {
      var v = snap.val();
      window._jackpotCache = (v && v>=50 && v<=1000) ? v : 50;
      if (currentTab==='boosts') renderBoosts();
    });
  } else if (currentTab==='boosts') {
    renderBoosts();
  }
}

// Крутка за Stars (платная) или бесплатная Premium-крутка — обе через /lottery_spin
// (кроме платной, которая обрабатывается сервером сразу в момент оплаты и приходит
// через pending_boosts/lottery_result — см. checkPendingBoosts).
function spinLotteryServer(via) {
  if (!tg || !tg.initData || typeof BOT_API_URL === 'undefined') return;
  fetch(BOT_API_URL + '/lottery_spin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({via: via, init_data: tg.initData})
  }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }); })
    .then(function(res){
      if (!res.ok) {
        if (res.status === 429) {
          showNotif(t('⏳ Крутка уже использована — попробуй позже','⏳ Spin already used — try again later'));
        } else {
          showNotif(t('❌ Не удалось крутнуть лотерею','❌ Lottery spin failed'));
        }
        return;
      }
      displayServerLotteryPrize(res.data.prize);
    }).catch(function(){ showNotif(t('❌ Нет связи с сервером','❌ No connection to server')); });
}

// После платной крутки лотереи — коротко опрашиваем Firebase, пока сервер (webhook
// successful_payment) не запишет решённый приз. Обычно занимает доли секунды.
function pollLotteryResult() {
  if (!firebaseDB) return;
  var pid = getPlayerId();
  var attempts = 0;
  var maxAttempts = 16; // ~8 секунд при интервале 500мс
  var poll = function() {
    attempts++;
    firebaseDB.ref('pending_boosts/' + pid + '/lottery_result').once('value', function(snap) {
      var prize = snap.val();
      if (prize) {
        firebaseDB.ref('pending_boosts/' + pid + '/lottery_result').remove();
        displayServerLotteryPrize(prize);
        return;
      }
      if (attempts < maxAttempts) setTimeout(poll, 500);
      else showNotif(t('🎰 Результат придёт чуть позже — проверь уведомления','🎰 Result will arrive shortly — check notifications'));
    });
  };
  poll();
}

function loadWithdrawalsLog() {
  var el = document.getElementById('withdrawals-log');
  if (!el) return;
  var liveItems = [];
  function render() {
    var el2 = document.getElementById('withdrawals-log');
    if (!el2) return;
    if (!liveItems.length) { el2.innerHTML = '<div style="color:#666;font-size:12px;text-align:center;padding:10px">'+t('Пока нет выплат','No payouts yet')+'</div>'; return; }
    var html = '';
    for (var i=0;i<liveItems.length;i++) {
      var it = liveItems[i];
      var gram = (typeof it.gram === 'number' ? it.gram : (it.amount||0)/100000).toFixed(5);
      var dateStr = '—';
      if (it.ts) {
        var d = new Date(it.ts);
        var dd = ('0'+d.getDate()).slice(-2);
        var mm = ('0'+(d.getMonth()+1)).slice(-2);
        var yy = String(d.getFullYear()).slice(-2);
        dateStr = dd+'/'+mm+'/'+yy;
      }
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a2a4a;font-size:12px;gap:8px">'
        + '<span style="color:#666;font-family:monospace;white-space:nowrap">'+dateStr+'</span>'
        + '<span style="color:#90caf9;font-family:monospace">'+shortWallet(it.wallet)+'</span>'
        + '<span style="color:#6ddc6d;font-weight:600;white-space:nowrap">💎 '+gram+' GRAM</span>'
        + '</div>';
    }
    el2.innerHTML = html;
  }
  if (!firebaseDB) { render(); return; }
  firebaseDB.ref('withdrawals_log').orderByKey().limitToLast(150).once('value', function(snap) {
    var data = snap.val();
    if (data) liveItems = Object.values(data).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

    return r.json().then(function(data){ return {ok:r.ok, status:r.status, data:data}; });
  }).then(function(res){
    if(!res.ok) { showNotif(t('Ошибка сервера (','Server error (')+res.status+'): '+(res.data&&res.data.error||t('неизвестная ошибка','unknown error'))); return; }

    if(data.link && tg && tg.openInvoice) {
      var invLink2 = data.link.replace('https://telegram.me/', 'https://t.me/');
      tg.openInvoice(invLink2, function(status){
        if(status==='paid') {
          state.coins=Math.round((state.coins-amount)*100)/100;
          showNotif(t('💸 Заявка на вывод ','💸 Withdrawal request for ') + amount + t(' монет отправлена! GRAM придут в течение 24ч',' coins sent! GRAM will arrive within 24h'), true);
          updateUI(); save();
          // Списание баланса и начисление реферального бонуса теперь делает сервер (bot.py)
          // сразу после подтверждения оплаты — это защищает от подмены суммы на клиенте.
        }
      });

      showNotif(t('Ошибка сервера: ','Server error: ')+data.error);
    } else { showNotif(t('Ошибка: нет ссылки на оплату','Error: no payment link')); }
  }).catch(function(){
    var cmd = '/bank '+amount+' '+wallet;

  });

function activateBoostWithTime(id, elapsed) {
  var now = Date.now();
  addQuestProgress('boost', 1);
  if (id==='energyFull') {
    state.energy = getEnergyMax();
    state.lastEnergyUpdate = now;
    save(); updateUI();
    return;
  }
  if (id==='truckRental') {
    var remainingRental = 43200000 - elapsed; // у аренды своя длительность — 12 часов
    if (remainingRental > 0) state.boosts.truckRental = now + remainingRental;
    return;
  }
  if (id==='luckyRod') {
    var remainingLucky = 1800000 - elapsed; // у удачной рыбалки своя длительность — 30 минут
    if (remainingLucky > 0) state.boosts.luckyRod = now + remainingLucky;
    return;
  }
  var remaining = 3600000 - elapsed; // остальные бусты длятся 1 час
  if (remaining <= 0) return; // буст уже истёк
  if (id==='doubleTap')  state.boosts.doubleTap  = now + remaining;
  if (id==='turboSpeed') state.boosts.turboSpeed  = now + remaining;
  if (id==='turboDry') {
    for (var j=0;j<state.drying.length;j++) state.drying[j].endsAt = now;
    showNotif(t('🌡 Вся сушка завершена мгновенно!','🌡 All drying finished instantly!'));
  }
  if (id==='turboPack') {
    for (var pi=0;pi<(state.filets||[]).length;pi++) {
      if (state.filets[pi].packingEndsAt) {
        state.filets[pi].dieAt = state.filets[pi].packingEndsAt + 10800000;
        state.filets[pi].packingEndsAt = now;
      }
    }
    showNotif(t('📦 Вся упаковка завершена мгновенно!','📦 All packing finished instantly!'));
  }
  save(); updateUI();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

// Уникальный анонимный ID игрока (генерируется один раз)
function getPlayerId() {
  // Используем Telegram user ID если доступен
  var tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (tgUser && tgUser.id) return 'tg_' + tgUser.id;
  // Fallback — случайный ID из localStorage
  var id = localStorage.getItem('ff_player_id');
  if (!id) {

// Порядковый номер игрока (Рыбак #N)
function getPlayerNumber(playerId, callback) {
  if (!firebaseDB) { callback(0); return; }
  var numRef = firebaseDB.ref('player_numbers/' + playerId);
  numRef.once('value', function(snap) {
    if (snap.exists()) { callback(snap.val()); return; }
    // Новый игрок — получаем следующий номер
    var counterRef = firebaseDB.ref('player_counter');
    counterRef.transaction(function(cur) { return (cur||0)+1; }, function(err, committed, snap2) {
      if (committed) {
        var num = snap2.val();
        numRef.set(num);
        callback(num);
      } else callback(0);
    });
  });
}

// Отправляем счёт в Firebase (не чаще раза в минуту)
var lastScoreUpload = 0;
function uploadScore() {
  if (!firebaseDB) return;
  var now = Date.now();
  if (now - lastScoreUpload < 60000) return;
  lastScoreUpload = now;
  var pid = getPlayerId();
  var tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var userId = tgUser ? tgUser.id : 0;
  var username = tgUser ? (tgUser.username || '') : '';
  var firstName = tgUser ? (tgUser.first_name || '') : '';
  getPlayerNumber(pid, function(num) {
    // coins/caught/totalEarned теперь авторитетно считает сервер (см. /actions, /sync) —
    // раньше здесь была защита "не даём заработку откатиться", которая брала максимум
    // между старым и новым значением. Она задумывалась для защиты от устаревших сессий
    // на других устройствах, но теперь мешает легитимным случаям (сброс прогресса,
    // исправление накрученного баланса) — с сервером как источником правды она не нужна.
    firebaseDB.ref('leaderboard/' + pid).once('value', function(snap) {
      var cur = snap.val();
      var premiumToWrite = state.premiumUntil || 0;
      if (cur) {
        // Защита от гонки при старте: если локальная проверка премиума ещё не подгрузилась
        // (state.premiumUntil всё ещё 0), не затираем уже известную активную подписку из базы
        if (!window._premiumCheckedOnce && typeof cur.premiumUntil === 'number' && cur.premiumUntil > now) {
          premiumToWrite = cur.premiumUntil;
        }
      }
      firebaseDB.ref('leaderboard/' + pid).set({
        num:         num,
        coins:       Math.floor(state.coins),
        caught:      state.caught,
        totalEarned: Math.floor(state.totalEarned || 0),
        loc:         state.currentLoc,
        ts:          now,
        userId:      userId,
        username:    username,
        firstName:   firstName,
        playerName:  state.playerName || '',
        premiumUntil: premiumToWrite
      });
    });
  });
}

          +'<div style="font-size:14px;font-weight:700;color:#6ddc6d">🐟'+fmt(e.data.caught)+'</div>'

      document.getElementById('leaders-list').innerHTML = html;
    });
  });

function buyPremium() {
  showNotif(t('⏳ Создаём счёт...','⏳ Creating invoice...'));
  var userId = tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;
  fetch(BOT_API_URL+'/invoice', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'subscribe',user_id:userId,init_data:tg&&tg.initData||''})
  }).then(function(r){
    return r.json().then(function(data){ return {ok:r.ok, status:r.status, data:data}; });
  }).then(function(res){
    if(!res.ok) { showNotif(t('Ошибка сервера (','Server error (')+res.status+'): '+(res.data&&res.data.error||t('неизвестная ошибка','unknown error'))); return; }
    var data = res.data;
    if(data.link && tg && tg.openInvoice) {
      var invLink = data.link.replace('https://telegram.me/', 'https://t.me/');
      tg.openInvoice(invLink, function(status){
        if(status==='paid') {
          showNotif(t('👑 Premium активируется в течение минуты!','👑 Premium activates within a minute!'));
          setTimeout(checkPremiumStatus, 3000);
          setTimeout(function(){ if(currentTab==='settings') renderSettings(); }, 3500);
        }
      });
    } else if (data.error) {
      showNotif(t('Ошибка сервера: ','Server error: ')+data.error);
    } else { showNotif(t('Ошибка: нет ссылки на оплату','Error: no payment link')); }
  }).catch(function(e){ showNotif(t('Ошибка: ','Error: ')+e.message); });
}

// ── Точный учёт денежных действий на сервере ─────────────────────────────
// Вместо того чтобы верить итоговым числам от клиента, сервер (bot.py) теперь сам
// считает стоимость каждого конкретного действия (улов/продажа/апгрейд) по реальному
// сохранённому уровню апгрейдов и реальной серверной цене рынка. Локально мы всё ещё
// сразу обновляем UI (для отзывчивости тапов), но именно ответ сервера — источник правды;
// он тихо поправит state, если локальный расчёт разошёлся с серверным.
//
// НАДЁЖНОСТЬ: очередь всегда дублируется в localStorage. Если игра закроется/перезагрузится
// до отправки — при следующем запуске несданные действия подхватятся и отправятся первым делом,
// а не потеряются молча (как было раньше — это приводило к "рыба уехала, а денег нет").
var PENDING_ACTIONS_KEY = 'ff_pending_actions';
window._pendingActions = (function(){
  try { return JSON.parse(localStorage.getItem(PENDING_ACTIONS_KEY) || '[]'); } catch(e) { return []; }
})();
function savePendingActionsLocally() {
  try { localStorage.setItem(PENDING_ACTIONS_KEY, JSON.stringify(window._pendingActions)); } catch(e){}
}
function queueAction(action) {
  window._pendingActions.push(action);
  savePendingActionsLocally();
  if (window._pendingActions.length >= 40) flushActions(); // не даём очереди расти бесконечно
  else {
    if (window._actionsFlushTimer) clearTimeout(window._actionsFlushTimer);
    window._actionsFlushTimer = setTimeout(flushActions, 3000);
  }
}
function applyActionsResult(res) {
  state.coins = res.coins;
  state.caught = res.caught;
  state.totalEarned = res.totalEarned;
  if (res.upgLevels) state.upgLevels = res.upgLevels;
  if (typeof res.energy === 'number') state.energy = res.energy;
  if (res.claimed && res.claimed.total > 0) {
    (res.claimed.details||[]).forEach(function(d){
      if (d.type==='ref') showNotif(t('👥 Реферальный бонус от ','👥 Referral bonus from ')+d.from+': +🪙'+fmt(d.amount));
      else showNotif(t('🎁 Бонус: +🪙','🎁 Bonus: +🪙')+fmt(d.amount));
    });
  }
  syncUpgradesToLoc(); calcStats(); updateUI();
  var raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
  raw.coins = state.coins; raw.caught = state.caught; raw.totalEarned = state.totalEarned; raw.upgLevels = state.upgLevels; raw.energy = state.energy;
  localStorage.setItem(SAVE_KEY, JSON.stringify(raw));
}
function flushActions() {
  if (window._actionsFlushTimer) { clearTimeout(window._actionsFlushTimer); window._actionsFlushTimer = null; }
  if (!window._pendingActions.length || !tg || !tg.initData || typeof BOT_API_URL === 'undefined') return;
  var batch = window._pendingActions;
  window._pendingActions = [];
  savePendingActionsLocally();
  fetch(BOT_API_URL + '/actions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ actions: batch, init_data: tg.initData })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (!res || !res.ok) { window._pendingActions = batch.concat(window._pendingActions); savePendingActionsLocally(); return; }
    // Сервер — источник правды. Молча принимаем его цифры (без пугающих уведомлений) —
    // расхождение почти всегда просто округление, а не читерство.
    applyActionsResult(res);
  }).catch(function(){
    // сеть недоступна — возвращаем действия в очередь (уже сохранены в localStorage), попробуем позже
    window._pendingActions = batch.concat(window._pendingActions);
    savePendingActionsLocally();
  });
}
// При закрытии/сворачивании — пробуем sendBeacon вместо fetch: обычный fetch может не успеть
// завершиться до выгрузки страницы, а sendBeacon специально создан для таких случаев (fire-and-forget,
// браузер гарантирует попытку отправки даже когда страница уже закрывается).
function flushActionsOnExit() {
  if (!window._pendingActions.length || !tg || !tg.initData || typeof BOT_API_URL === 'undefined') return;
  if (navigator.sendBeacon) {
    try {
      var blob = new Blob([JSON.stringify({ actions: window._pendingActions, init_data: tg.initData })], {type: 'application/json'});
      var ok = navigator.sendBeacon(BOT_API_URL + '/actions', blob);
      if (ok) { window._pendingActions = []; savePendingActionsLocally(); return; }
    } catch(e){}
  }
  flushActions(); // фолбэк, если sendBeacon недоступен
}
window.addEventListener('beforeunload', flushActionsOnExit);
document.addEventListener('visibilitychange', function(){ if (document.hidden) flushActionsOnExit(); });
// На случай, если предыдущая сессия закрылась до отправки — досылаем оставшееся сразу при запуске
if (window._pendingActions.length) setTimeout(flushActions, 1000);

function tapOcean(e) {
  e.preventDefault();
  var now=Date.now();
  if (now-lastTapTime<200) return;
  lastTapTime=now; tapTimes.push(now); updateScare();
  var touch=e.touches&&e.touches[0]?e.touches[0]:e;
  var rect=document.getElementById('ocean').getBoundingClientRect();
  var x=(touch.clientX||touch.pageX)-rect.left, y=(touch.clientY||touch.pageY)-rect.top;
  if (!tapped) { document.getElementById('hint').style.opacity='0'; tapped=true; }
  if (scareFactor<0.5) spawnAnim(x,y,'🐟','😨 Напугана!');
  if (Math.random()>catchChance()) { spawnAnim(x,y,'💨',t('Мимо!','Miss!')); if(currentTab==='upgrades') renderUpgrades(); return; }

  if (!hasEnergy()) {
    spawnAnim(x,y,'⚡',t('Нет энергии!','No energy!'));
    showNotif(t('⚡ Энергия закончилась! Подожди восстановления или пополни в разделе Бустеры','⚡ Out of energy! Wait for it to regen or refill it in the Boosters section'));
    if(currentTab==='upgrades') renderUpgrades();
    // Даже без улова — лёгкий пинг серверу (не чаще раза в 20с), чтобы lastEnergyUpdate
    // не "застаивался" на время ожидания регена, иначе при первом же успешном тапе после
    // паузы сервер досчитает всю накопленную регенерацию разом, и энергия резко "прыгнет".
    if (!window._energyPingTimer && tg && tg.initData) {
      window._energyPingTimer = setTimeout(function(){
        window._energyPingTimer = null;
        syncMoneyToServer();
      }, 1000);
    }
    return;
  }

  // Шанс поймать редкую рыбу если она активна
  if (rareFishActive && Math.random() < 0.15) {
    var rareEarned = Math.round(RARE_FISH.price * (getLoc().tapMult||1));
    state.coins = Math.round((state.coins + rareEarned)*100)/100;
    state.totalEarned = Math.round((state.totalEarned + rareEarned)*100)/100;
    state.caught++;
    queueAction({type:'rare_fish_catch', loc: state.currentLoc});
    checkAdMilestone();
    spendEnergyForCatch();
    state.caughtFish[RARE_FISH.name] = (state.caughtFish[RARE_FISH.name]||0)+1;
    addQuestProgress('catch', 1);
    spawnAnim(x,y,RARE_FISH.emoji,'🎉 +'+rareEarned+'!');
    showNotif(t('Поймал Осетрину! +🪙','Caught a Sturgeon! +🪙')+rareEarned);
    updateUI(); save();
    if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    return;
  }

  var f=randFish();
  var boostMult=1;
  var earned=Math.round(state.tapPower*boostMult*10)/10;
  state.coins=Math.round((state.coins+earned)*100)/100;
  state.totalEarned=Math.round((state.totalEarned+earned)*100)/100;
  state.caught++;
  queueAction({type:'catch', loc: state.currentLoc});
  checkAdMilestone();
  spendEnergyForCatch();
  state.caughtFish[f.name]=(state.caughtFish[f.name]||0)+1;
  pushLiveFish({name:f.name,emoji:f.emoji,dieAt:Date.now()+f.life*3600000});
  unlockFish();
  // Квест: улов
  var isRare = (FISH[state.currentLoc]||[]).indexOf(f) > 0;
  addQuestProgress('catch', 1);
  if (isRare) addQuestProgress('rare', 1);
  spawnAnim(x,y,f.emoji,'+'+earned.toFixed(1));
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
function buyUpgrade(id) {
  var u=null; for (var i=0;i<UPGRADES.length;i++) if(UPGRADES[i].id===id) u=UPGRADES[i];
  if (!u||u.bought>=u.max) return;
  var cost=upgCost(u,u.bought); if (state.coins<cost) return;
  state.coins=Math.round((state.coins-cost)*100)/100; u.bought++;
  setUpgLevel(id, u.bought); // сохраняем именно в текущую локацию
  queueAction({type:'buy_upgrade', loc: state.currentLoc, upg: id});
  // Реферальная награда: реферер получает 1000 монет когда реферал купил удочку ур.2
  if (id==='rod' && u.bought===2) {
    checkAndApplyRefRewards(true);
  }
  // Акция на покупку Сети (если активна)
  if (id==='net' && u.bought===1) {
    checkNetBonus();
  }
  calcStats(); unlockFish(); updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function checkNetBonus() {
  if (!firebaseDB) return;
  firebaseDB.ref('promo/net_bonus').once('value', function(snap) {
    var d = snap.val();
    if (!d || !d.endsAt || Date.now() > d.endsAt) return;
    // Акция активна — начисляем бонус
    state.coins = Math.round((state.coins + (d.bonus||500))*100)/100;
    state.totalEarned = Math.round((state.totalEarned + (d.bonus||500))*100)/100;
    queueAction({type:'net_promo_bonus', loc: state.currentLoc});
    flushActions();
    showNotif(t('🎁 Бонус за покупку Сети! +🪙','🎁 Net purchase bonus! +🪙')+fmt(d.bonus||500));
    updateUI(); save();
  });
}

function changeSaltOrder(delta) {
  var tr=getTr();

  var grouped={};
  for (var i=0;i<state.liveFish.length;i++) { var n=state.liveFish[i].name; grouped[n]=(grouped[n]||0)+1; }

  for (var j=0;j<state.driedFish.length;j++) { var dn=state.driedFish[j].name; driedGrouped[dn]=(driedGrouped[dn]||0)+1; }
  var selPool=state.selectedDried?driedGrouped:grouped;
  var selCnt=sel&&selPool[sel]?Math.min(selPool[sel],tr.capacity):0;

function selectFish(name, dried, filet) {
  if (!state.selectedItems) state.selectedItems = [];
  var tr = getTr();
  var key = name + '|' + (dried?'dry':filet?'filet':'fresh');
  var existing = null;
  for (var i=0; i<state.selectedItems.length; i++) {
    if (state.selectedItems[i].key === key) { existing = i; break; }
  }
  // Считаем текущую загрузку
  var totalSelected = 0;
  for (var j=0; j<state.selectedItems.length; j++) totalSelected += state.selectedItems[j].qty;

  if (existing !== null) {
    // Уже выбран — убираем
    state.selectedItems.splice(existing, 1);
  } else {
    // Сколько доступно этого вида
    var pool = dried ? driedGrouped : filet ? filetGrouped2 : grouped;
    var available = pool ? (pool[name] || 0) : 0;
    var room = tr.capacity - totalSelected;
    var qty = Math.min(available, room);
    if (qty <= 0) { showNotif(t('Транспорт заполнен!','Transport full!')); return; }
    state.selectedItems.push({key:key, name:name, dried:!!dried, filet:!!filet, qty:qty});
  }
  // Совместимость со старым кодом
  if (state.selectedItems.length > 0) {
    var last = state.selectedItems[state.selectedItems.length-1];
    state.selectedFish = last.name;
    state.selectedDried = last.dried;
    state.selectedFilet = last.filet;
  } else {
    state.selectedFish = null; state.selectedDried = false; state.selectedFilet = false;
  }
  renderMarket();
}

function sendDelivery() {
  if (state.delivery) return;
  var tr=getTr(), dur=getDur(tr.id);
  if (state.delivery2 && state.delivery2.transportId === tr.id) { showNotif(t('🚫 Этот транспорт занят водителем!','🚫 This transport is used by the driver!')); return; }
  if (dur<=0) { showNotif(t('🔧 Сломан! Почини транспорт.','🔧 Broken! Repair the transport.')); return; }
  if (!state.selectedItems || !state.selectedItems.length) { showNotif(t('Выбери что отправить!','Choose what to send!')); return; }

  var earn=0, sentCount=0;

  for (var si=0; si<state.selectedItems.length; si++) {
    var item = state.selectedItems[si];
    var need = item.qty;

    if (item.filet) {
      var takenF=0, restFilets=[];
      for (var f=0;f<(state.filets||[]).length;f++) {
        var ff=state.filets[f];
        var room=need-takenF;
        if (ff.name===item.name && !ff.packingEndsAt && room>0) {
          var pk=ff.packets||1;
          var mpF=marketPrices[item.name]||{cur:BASE_PRICES[item.name]||1};
          if (pk<=room) { earn+=mpF.cur*5*pk; takenF+=pk; }
          else { earn+=mpF.cur*5*room; takenF+=room; restFilets.push({name:ff.name,emoji:ff.emoji,packets:pk-room,packingEndsAt:ff.packingEndsAt||0}); }
        } else restFilets.push(ff);
      }
      state.filets=restFilets; sentCount+=takenF;
    } else if (item.dried) {
      var taken=0, rest=[];
      for (var i=0;i<state.driedFish.length;i++) {
        if (state.driedFish[i].name===item.name && taken<need) {
          var mpD=marketPrices[item.name]||{cur:BASE_PRICES[item.name]||1};
          earn+=mpD.cur*3; taken++;
        } else rest.push(state.driedFish[i]);
      }
      state.driedFish=rest; sentCount+=taken;
    } else {
      var taken2=0, rest2=[];
      for (var j=0;j<state.liveFish.length;j++) {
        if (state.liveFish[j].name===item.name && taken2<need) {
          var mpL=marketPrices[item.name]||{cur:BASE_PRICES[item.name]||1};
          earn+=mpL.cur; taken2++;
        } else rest2.push(state.liveFish[j]);
      }
      state.liveFish=rest2; sentCount+=taken2;
    }
  }

  if (!sentCount) { showNotif(t('Нет рыбы на складе!','No fish in storage!')); return; }
  earn=Math.round(earn*100)/100;
  // Отправляем на сервер точные действия продажи — по одному на каждый проданный вид/тип,
  // чтобы сервер сам посчитал стоимость по реальной серверной цене рынка.
  for (var qi=0; qi<state.selectedItems.length; qi++) {
    var qitem = state.selectedItems[qi];
    if (!qitem.qty) continue;
    queueAction({
      type:'sell', loc: state.currentLoc, name: qitem.name, qty: qitem.qty,
      kind: qitem.filet ? 'filet' : qitem.dried ? 'dried' : 'fresh'
    });
  }
  var secs=delivTime(tr);
  var saltOrder=state.saltOrder||0;
  var saltPrice=SALT_PRICE[state.currentLoc]||1;
  var saltCost=saltOrder*saltPrice;
  var knifeOrder=state.knifeOrder||0;
  var knifePrice=KNIFE_PRICE[state.currentLoc]||3;
  var knifeCost=knifeOrder*knifePrice;
  if ((saltCost+knifeCost)>state.coins) { showNotif(t('Не хватает монет на заказ!','Not enough coins for the order!')); return; }
  if (saltOrder>0) state.coins=Math.round((state.coins-saltCost)*100)/100;
  if (knifeOrder>0) state.coins=Math.round((state.coins-knifeCost)*100)/100;
  if (saltOrder>0 || knifeOrder>0) queueAction({type:'buy_supplies', loc: state.currentLoc, salt: saltOrder, knife: knifeOrder});
  if (tr.id !== 'rentalTruck') {
    state.durability[tr.id]=Math.max(0,dur-10);
    queueAction({type:'transport_wear', loc: state.currentLoc, transport: tr.id});
  }
  state.delivery={transportId:tr.id,count:sentCount,earnings:earn,startedAt:Date.now(),endsAt:Date.now()+secs*1000,saltOrder:saltOrder,knifeOrder:knifeOrder};
  state.saltOrder=0; state.knifeOrder=0;
  state.selectedItems=[]; state.selectedFish=null; state.selectedDried=false; state.selectedFilet=false;
  addQuestProgress('deliver', 1);
  updateUI(); save();
  if (tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
